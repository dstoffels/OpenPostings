services:
  api:
    build: .
    image: openpostings-api:local
    container_name: openpostings-api
    restart: unless-stopped
    # Not published to the host — only `proxy` talks to this, over the
    # compose network, at api:8787.
    expose:
      - "8787"
    environment:
      - PORT=8787
      - DB_PATH=/app/data/jobs.db
    # A directory bind mount (not per-file) so a fresh clone — where jobs.db
    # doesn't exist yet, by design — doesn't hit Docker's "create an empty
    # directory when the bind source is missing" gotcha. The app creates
    # jobs.db (+ -wal/-shm) and logs/ inside ./data on first run. Don't run
    # this alongside a native `npm run server`; both would fight over the
    # same SQLite file.
    volumes:
      - ./data:/app/data

  mcp:
    build: .
    image: openpostings-mcp:local
    container_name: openpostings-mcp
    restart: unless-stopped
    # Same image as `api`, different entry point.
    command: ["node", "server/mcp-apply-server.js"]
    # Not published to the host — only `proxy` talks to this, over the
    # compose network, at mcp:8788.
    expose:
      - "8788"
    environment:
      - MCP_PORT=8788
      # Must bind all interfaces inside the container, not just 127.0.0.1
      # (the app's local-testing default), or `proxy` can't reach it.
      - MCP_HOST=0.0.0.0
      # Required — the app itself refuses to start without this (it holds
      # PII and can submit job applications). Set it in a .env file next to
      # this compose file; there's no default.
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in a .env file before starting}
      - DB_PATH=/app/data/jobs.db
    # Same directory-mount rationale as `api` — shares the same jobs.db.
    volumes:
      - ./data:/app/data

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    image: openpostings-proxy:local
    container_name: openpostings-proxy
    restart: unless-stopped
    depends_on:
      - api
      - mcp
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set SITE_ADDRESS to your real domain in a .env file next to this
      # compose file for production HTTPS; defaults to plain HTTP on :80.
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
